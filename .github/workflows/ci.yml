name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Schreadt.slnx

      - name: Build
        run: dotnet build Schreadt.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Schreadt.slnx --configuration Release --no-build

      - name: Publish examples
        shell: pwsh
        run: ./scripts/Publish-AllExamples.ps1 -Runtime ${{ matrix.runtime }} -Configuration Release

      - name: Package published examples
        id: package
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $PWD 'artifacts/packages'
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null

          $extension = if ('${{ matrix.runtime }}'.StartsWith('win-')) { 'zip' } else { 'tar.gz' }
          $packagePath = Join-Path $packageDirectory "Schreadt-examples-${{ matrix.runtime }}.$extension"
          & tar -acf $packagePath `
            -C (Join-Path $PWD 'artifacts/publish') `
            'Example-Game/${{ matrix.runtime }}' `
            'Mandelbrot-Explorer/${{ matrix.runtime }}'
          if ($LASTEXITCODE -ne 0) {
            throw "tar failed with exit code $LASTEXITCODE."
          }

          "path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: Upload published examples
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          archive: false
